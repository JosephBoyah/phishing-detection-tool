<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan · Phishing Detection Tool</title>
<script src="{{ request.script_root }}/static/chart.umd.min.js"></script>
<style>
  :root{--bg:#0f1226;--card:#1a1f3d;--accent:#7c5cff;--good:#3ddc84;--bad:#ff5470;--warn:#ffce5a;--ink:#eef0ff;--mut:#9aa0c7}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:linear-gradient(90deg,#1a1f3d,#241a4d);border-bottom:1px solid #2c2f55}
  header h1{font-size:18px;margin:0}
  nav a{color:var(--ink);text-decoration:none;margin-left:18px;font-size:14px;opacity:.85}
  .wrap{max-width:820px;margin:24px auto;padding:0 16px}
  .panel{background:var(--card);border-radius:14px;padding:20px;border:1px solid #2c2f55}
  textarea,select{width:100%;background:#0f1226;color:var(--ink);border:1px solid #2c2f55;border-radius:10px;padding:12px;font-size:14px;font-family:monospace}
  .btn{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg button{background:#0f1226;color:var(--ink);border:1px solid #2c2f55;border-radius:10px;padding:8px 14px;cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accent)}
  #result{margin-top:18px}
  .verdict{font-size:26px;font-weight:800;padding:14px;border-radius:12px;text-align:center}
  .v-phish{background:rgba(255,84,112,.15);color:var(--bad)}
  .v-susp{background:rgba(255,206,90,.15);color:var(--warn)}
  .v-legit{background:rgba(61,220,132,.15);color:var(--good)}
  .reasons{margin-top:12px}
  .reasons li{margin:4px 0}
  .meta{color:var(--mut);font-size:13px;margin-top:10px}
  pre{background:#0f1226;border-radius:10px;padding:12px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<header><h1>🛡️ Phishing Detection Tool</h1>
<nav><a href="{{ request.script_root }}/">Dashboard</a><a href="{{ request.script_root }}/scan">Scan</a><a href="{{ request.script_root }}/reports">Reports</a></nav></header>
<div class="wrap">
  <div class="panel">
    <div class="seg">
      <button id="b-url" class="on" onclick="setKind('url')">🔗 URL</button>
      <button id="b-email" onclick="setKind('email')">✉️ Email (raw headers)</button>
    </div>
    <textarea id="input" rows="6" placeholder="Paste a URL or full raw email (.eml) here..."></textarea>
    <button class="btn" onclick="runScan()">Analyze</button>
  </div>
  <div id="result"></div>
</div>
<script>
let kind='url';
function setKind(k){kind=k;document.getElementById('b-url').classList.toggle('on',k==='url');document.getElementById('b-email').classList.toggle('on',k==='email');}
async function runScan(){
  const val=document.getElementById('input').value.trim();
  if(!val){alert('Paste something first');return;}
  const res=await fetch(window.location.pathname.replace(/\/[^/]*$/,'')+'/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:val,kind})});
  const d=await res.json();
  if(d.error){document.getElementById('result').innerHTML='<div class="verdict v-phish">Error: '+d.error+'</div>';return;}
  const v=d.decision.verdict;
  const cls=v==='PHISHING'?'v-phish':v==='SUSPICIOUS'?'v-susp':'v-legit';
  const reasons=(d.decision.reasons||[]).map(r=>'<li>'+r+'</li>').join('');
  document.getElementById('result').innerHTML=`
   <div class="verdict ${cls}">${v} — risk ${d.decision.risk_score}</div>
   <div class="reasons"><p><b>Why:</b></p><ul>${reasons||'<li>No strong signals</li>'}</ul></div>
   <div class="meta">ML model: ${d.decision.ml_model} · ML prob: ${d.decision.ml_probability} · Rule score: ${d.decision.rule_score}</div>
   <details class="meta"><summary>Raw features</summary><pre>${JSON.stringify(d.features,null,2)}</pre></details>`;
}
</script>
</body>
</html>
