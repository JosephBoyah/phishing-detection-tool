services:
  phishing:
    build: .
    image: phishing-detection-tool:latest
    restart: unless-stopped
    environment:
      - PORT=5000
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
    networks:
      foundation_net:
        ipv4_address: 172.16.1.10
    labels:
      - "traefik.enable=true"
      # Primary host (may be filtered by 'phish' keyword on some networks)
      - "traefik.http.routers.phishing.rule=Host(`phish.srv1846347.hstgr.cloud`)"
      - "traefik.http.routers.phishing.entrypoints=websecure"
      - "traefik.http.routers.phishing.tls.certresolver=letsencrypt"
      # Neutral alias (same app) to bypass keyword filters
      - "traefik.http.routers.phishing-alt.rule=Host(`check.srv1846347.hstgr.cloud`)"
      - "traefik.http.routers.phishing-alt.entrypoints=websecure"
      - "traefik.http.routers.phishing-alt.tls.certresolver=letsencrypt"
      - "traefik.http.services.phishing.loadbalancer.server.port=5000"

networks:
  foundation_net:
    external: true
    name: foundation_net
