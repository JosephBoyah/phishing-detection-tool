services:
  phishing:
    build: .
    image: phishing-detection-tool:latest
    restart: unless-stopped
    environment:
      - PORT=5000
      - APP_ROOT=/phishing
      # Optional: enable Google Safe Browsing. Leave blank to disable (rule engine still works).
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
    networks:
      foundation_net:
        ipv4_address: 172.16.1.10
    labels:
      - "traefik.enable=true"
      # Served under the WORKING domain app.srv1846347.hstgr.cloud at /phishing
      - "traefik.http.routers.phishing.rule=Host(`app.srv1846347.hstgr.cloud`) && PathPrefix(`/phishing`)"
      - "traefik.http.routers.phishing.entrypoints=websecure"
      - "traefik.http.routers.phishing.tls.certresolver=letsencrypt"
      - "traefik.http.services.phishing.loadbalancer.server.port=5000"

networks:
  foundation_net:
    external: true
    name: foundation_net
