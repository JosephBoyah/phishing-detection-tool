services:
  phishing:
    build: .
    image: phishing-detection-tool:latest
    restart: unless-stopped
    environment:
      - PORT=8080
      # Optional: enable Google Safe Browsing. Leave blank to disable (rule engine still works).
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
    network_mode: host
    # Direct host port publish (no DNS / no cert needed). Also routed via Traefik
    # for the public HTTPS domains below.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phishing.rule=Host(`phish.srv1846347.hstgr.cloud`)"
      - "traefik.http.routers.phishing.entrypoints=websecure"
      - "traefik.http.routers.phishing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.phishing-sslip.rule=Host(`phish.187.55.230.98.sslip.io`)"
      - "traefik.http.routers.phishing-sslip.entrypoints=websecure"
      - "traefik.http.routers.phishing-sslip.tls.certresolver=letsencrypt"
      - "traefik.http.services.phishing.loadbalancer.server.port=8080"
